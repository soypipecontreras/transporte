<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Camionero · Ingreso · Transporte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C2410C}a:hover{color:#9A3412}
input:focus{outline:2px solid #C2410C;outline-offset:1px}
</style>
<style>body{margin:0;background:#2A2D35;font-family:Archivo,sans-serif}
.escenario{min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px 16px;box-sizing:border-box}
.celular{border-radius:36px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);border:10px solid #0B0C0F}
.volver{color:#F3F1EC;font-weight:600;text-decoration:none}
@media (max-width:430px){.escenario{padding:0;gap:0}.celular{border:0;border-radius:0;box-shadow:none}.volver{padding:12px}}</style>
</head>
<body>
<div class="escenario"><a class="volver" href="index.html">← Todas las pantallas</a><div class="celular">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #15171C; color: #F3F1EC; font-family: Archivo, sans-serif; display: flex; flex-direction: column; padding: 56px 24px 32px 24px; gap: 32px">
  <div style="display: flex; align-items: center; gap: 12px">
    <div style="width: 44px; height: 44px; border-radius: 10px; background: #C2410C; display: flex; align-items: center; justify-content: center">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11v9H3z"></path><path d="M14 9h4l3 3v3h-7z"></path><circle cx="7" cy="17.5" r="1.8"></circle><circle cx="17" cy="17.5" r="1.8"></circle></svg>
    </div>
    <div style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em">Transporte</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 40px">
    <h1 style="margin: 0; font-size: 36px; line-height: 1.05; font-weight: 800; letter-spacing: -0.03em">Viajes con pago seguro en 5 días hábiles.</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.45; color: #C9C4BA">Sin despachadores ni descuentos escondidos. Lo que ves en la oferta es lo que te pagan.</p>
  </div>
  <form style="display: flex; flex-direction: column; gap: 16px; margin-top: auto">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #E6E1D8">Correo
      <input type="email" value="camionero@demo.co" style="height: 52px; border-radius: 10px; border: 1px solid #3A3D45; background: #22252C; color: #F3F1EC; font-size: 17px; padding: 0 14px; font-family: Archivo, sans-serif">
    </label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 600; color: #E6E1D8">Contraseña
      <input type="password" value="demo1234" style="height: 52px; border-radius: 10px; border: 1px solid #3A3D45; background: #22252C; color: #F3F1EC; font-size: 17px; padding: 0 14px; font-family: Archivo, sans-serif">
    </label>
    <a href="camionero-ofertas.html" style="height: 56px; border: 0; border-radius: 12px; background: #C2410C; color: #FFFFFF; font-size: 18px; font-weight: 700; font-family: Archivo, sans-serif; margin-top: 8px; display: flex; align-items: center; justify-content: center; text-decoration: none">Entrar</a>
    <a href="#" style="text-align: center; font-size: 16px; font-weight: 600; color: #F3F1EC; padding: 12px 0">Soy nuevo: registrar mi camión</a>
  </form>
  <div style="font-size: 13px; color: #A39E94; text-align: center">Por ahora todos entran con correo y la contraseña demo1234. Después: celular y código.</div>
</div>
</div></div>
</body>
</html>
